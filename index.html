<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鳳梨出貨">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light only">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>鳳梨小姐出貨系統</title>
<style>
:root{
  color-scheme: light only;
  --bg:#FFFFFF; --surface:#F6F6F6; --surface2:#EEEEEE; --line:#E8E8E8;
  --ink:#000000; --ink2:#5E5E5E; --ink3:#A6A6A6;
  --green:#05A357; --green-bg:#E6F6EE; --red:#E11900; --red-bg:#FFEFED; --orange:#FF6B00; --orange-bg:#FFF1E5;
  --yellow-bg:#FFF6D9; --yellow-ink:#7A5A00; --blue:#276EF1;
  --p-web:#F5B400; --p-shopee:#EE4D2D; --p-myship:#00843D; --p-711-o:#F48120; --p-711-r:#E3001B;
  --ease:cubic-bezier(.3,.2,.3,1); --spring:cubic-bezier(.3,.2,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:filter .18s ease,transform .18s ease,background .25s ease,opacity .25s ease}
button:active,button.tap,.prow.tap,a.tap{filter:brightness(.82);transform:scale(.97)}
.go:active,.go.tap,.btn-main:active,.btn-main.tap{filter:brightness(1.6) contrast(.85)}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
.wrap{max-width:640px;margin:0 auto;padding:0 18px calc(120px + env(safe-area-inset-bottom))}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:5;margin:0 -18px;padding:max(14px,env(safe-area-inset-top)) 18px 12px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);transition:box-shadow .25s}
.top.shadow{box-shadow:0 1px 0 var(--line)}
.top-row{display:flex;align-items:flex-start;gap:10px}
.date{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.2px}
.title{font-size:clamp(22px,6.6vw,28px);font-weight:800;letter-spacing:-.6px;line-height:1.15;margin-top:2px;white-space:nowrap}
.top-row > div:first-child{min-width:0}
.hello{font-size:15px;color:var(--ink2);margin-top:4px}
.hello b{color:var(--ink)}
.avatar{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:18px;position:relative;flex:none;transition:transform .2s var(--ease)}
.avatar:active{transform:scale(.92)}
.avatar .k{position:absolute;right:-2px;bottom:-2px;background:var(--ink);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:2px 5px;border:2px solid #fff}

.cutoff{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.cutoff svg{flex:none}
.cutoff .sub{color:var(--ink2);font-weight:500}
.cutoff.closed{background:var(--orange-bg);color:#8A3A00}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface);border-radius:14px;padding:10px 6px 8px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2);font-weight:600}
.stat.hl b{color:var(--green)}
.stat{cursor:pointer;transition:background .3s ease,color .3s ease,transform .18s ease}
.stat:active{transform:scale(.96)}
.stat.on{background:var(--ink);color:#fff}
.stat.on span{color:rgba(255,255,255,.75)}
.stat.on.hl b{color:#5BE59A}
.sfbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:10px 14px;border-radius:14px;background:var(--surface);font-size:14px;font-weight:700}
.sfbar button{font-size:14px;font-weight:700;color:var(--ink2);padding:4px 8px;border-radius:999px;background:#fff}

.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);color:#fff}

/* ---------- views ---------- */
.view{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.sec{font-size:13px;font-weight:700;color:var(--ink2);margin:18px 2px 0;letter-spacing:.3px}

/* ---------- card ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px 20px;position:relative;overflow:hidden;transition:transform .42s var(--ease),opacity .42s var(--ease),box-shadow .25s}
.card.new{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.card.leaving{transform:translateX(40px);opacity:0}
.card.urgent{border:2px solid var(--red);padding:15px 15px 13px 19px}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.c-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;line-height:1.3}
.tag.red{background:var(--red);color:#fff}
.tag.orange{background:var(--orange-bg);color:var(--orange)}
.tag.gray{background:var(--surface);color:var(--ink2)}
.tag.overdue{background:var(--red-bg);color:var(--red)}
.age{margin-left:auto;font-size:13px;color:var(--ink3);font-weight:500}
.ono-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.ono{font:700 20px/1.2 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.3px;word-break:break-all}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex:none;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.9);background:var(--surface2)}
.items{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.item{align-items:center;gap:12px}
.pimg{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface);flex:none;display:block;cursor:zoom-in;}
@keyframes imgIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.pimg.sm{width:46px;height:46px;border-radius:10px}
.pimg.ph{display:grid;place-items:center;color:var(--ink3);cursor:default;animation:none}
.itx{min-width:0;flex:1}
.iname{font-size:16px;font-weight:700;line-height:1.3}
.imeta{display:flex;align-items:center;gap:6px;margin-top:3px}
.iq{font-size:14px;font-weight:800;color:var(--ink2)}
.iprev{display:flex;align-items:center;flex:none}
.catgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.catgrid .pimg{width:100%;height:auto;aspect-ratio:1}
.loc{font-size:12px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.3px;flex:none}
.note{margin-top:10px;background:var(--yellow-bg);border-radius:12px;padding:9px 12px;font-size:14px;white-space:pre-wrap;color:#3d3000}
.note b{color:var(--yellow-ink)}

.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px}
.prog i{height:5px;border-radius:3px;background:var(--surface2);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:var(--green);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.prog i.on::after{transform:scaleX(1)}
.prog-l{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:13px;color:var(--ink2)}
.prog-l b{color:var(--ink);font-weight:700}
.prog-l .ph{display:flex;align-items:center;gap:4px;color:var(--green);font-weight:700}

.hint-box{margin-top:12px;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.hint-box .tx{flex:1}
.hint-box button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:5px}

.go{width:100%;margin-top:12px;padding:15px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),opacity .2s}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.5}
.card.urgent .go{background:var(--red)}
.sub{display:flex;gap:8px;margin-top:8px}
.sub button{flex:1;padding:10px 0;border-radius:12px;background:var(--surface);font-size:14px;font-weight:600;transition:transform .15s,background .2s}
.sub button:active{transform:scale(.96);background:var(--surface2)}
.sub button.u-on{color:var(--red)}

.empty{text-align:center;color:var(--ink2);padding:64px 20px}
.empty .big{font-size:44px;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* skeleton */
.sk{height:150px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 0%,#fafafa 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- pick list ---------- */
.pick-sum{display:flex;align-items:baseline;gap:8px;margin-top:16px}
.pick-sum b{font-size:28px;font-weight:800;letter-spacing:-.5px}
.pick-sum span{color:var(--ink2);font-size:14px}
.prow{display:flex;align-items:center;gap:12px;padding:14px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:opacity .25s,transform .2s}
.prow:active{transform:scale(.99)}
.prow.done{opacity:.45}
.prow.done .pn{text-decoration:line-through}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink3);flex:none;display:grid;place-items:center;transition:all .25s var(--spring)}
.prow.done .ck{background:var(--green);border-color:var(--green);transform:scale(1.08)}
.ck svg{opacity:0;transform:scale(.4);transition:all .25s var(--spring)}
.prow.done .ck svg{opacity:1;transform:none}
.pmain{flex:1;min-width:0}
.pn{font-weight:700;font-size:16px}
.pref{font-size:12px;color:var(--ink2);margin-top:2px}
.pq{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pq small{font-size:14px;font-weight:700;color:var(--ink2)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;margin-top:14px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink2);transition:all .25s var(--ease)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn-wide{width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn-wide:active{transform:scale(.97)}
.btn-wide.dark{background:var(--ink);color:#fff}
.btn-wide.light{background:var(--surface)}

/* ---------- bottom bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));z-index:8;padding:0 14px;pointer-events:none}
.tabbar-in{pointer-events:auto;position:relative;max-width:520px;margin:0 auto;display:flex;padding:5px;border-radius:999px;background:rgba(250,250,250,.72);-webkit-backdrop-filter:saturate(190%) blur(26px);backdrop-filter:saturate(190%) blur(26px);border:.5px solid rgba(0,0,0,.08);box-shadow:0 10px 34px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.9)}
.tb-pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 5);border-radius:999px;background:rgba(0,0,0,.075);box-shadow:inset 0 .5px 0 rgba(255,255,255,.7);transition:transform .45s cubic-bezier(.3,.2,.3,1)}
.tb{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;font-size:10.5px;font-weight:700;color:#48484A;transition:color .3s ease}
.tb svg{width:23px;height:23px}
.tb.on,.tb.hover{color:var(--ink)}
.tb .badge{position:absolute;top:1px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;line-height:15px;min-width:17px;text-align:center;border-radius:999px;padding:0 4px;font-weight:800}
.tb .badge.dark{background:var(--ink)}
.go.light{background:var(--surface);color:var(--ink)}
.card.urgent .go.light{background:var(--surface)}
.printbar{display:flex;gap:10px;margin:0 0 14px}
#sheet.sheet{background:rgba(242,242,244,.96)}
.dt .ono-row{margin-top:12px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.dh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:8px}
.dh span{font-weight:700;color:var(--ink3)}
.dcard .items{margin-top:0}
.drow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.drow span{color:var(--ink2)}
.drow:last-of-type{border-bottom:0}
.dempty{color:var(--ink3);font-size:14px}
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:12px;position:relative;padding:0 0 14px}
.tli:last-child{padding-bottom:0}
.tli i{flex:none;width:10px;height:10px;border-radius:50%;background:#C7C7CC;margin-top:6px;position:relative;z-index:1}
.tli:not(:last-child)::before{content:"";position:absolute;left:4.5px;top:16px;bottom:-2px;width:1px;background:var(--line)}
.tli.now i{background:var(--ink)}
.tli b{display:block;font-size:15px}
.tli span{font-size:13px;color:var(--ink3)}
.tag.st-gray{background:var(--surface);color:var(--ink2)}
.tag.st-dark{background:var(--ink);color:#fff}
.tag.st-green{background:var(--green-bg);color:var(--green)}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.who span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:999px;background:var(--surface);font-size:14px;color:var(--ink2)}
.who svg{width:17px;height:17px;color:var(--ink)}
.who b{color:var(--ink);font-weight:800}
.who i{font-style:normal;color:var(--ink3);font-size:13px}
.printbar button{flex:1;padding:14px 8px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px}
.printbar button i{width:9px;height:9px;border-radius:50%;flex:none}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:9;width:60px;height:60px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.fab:active{transform:scale(.9) rotate(90deg)}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:20;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;transition:background .4s ease}
.mask.show{background:rgba(0,0,0,.35);pointer-events:auto}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s cubic-bezier(.3,.2,.3,1)}
.mask.show .sheet{transform:none}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--surface2);margin:0 auto 16px}
.sheet h2{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:-.6px}
.sheet .hint{font-size:14px;color:var(--ink2);margin:4px 0 0}
.lbl{font-size:13px;font-weight:700;color:var(--ink2);margin:18px 2px 8px}
.pfs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pfs button{padding:14px 0;border-radius:12px;font-weight:800;background:var(--surface);transition:all .2s var(--ease)}
.pfs button:active{transform:scale(.96)}
.inp{width:100%;padding:14px;border-radius:12px;border:2px solid transparent;background:var(--surface);font-size:17px;outline:none;transition:border-color .2s,background .2s}
.inp:focus{border-color:var(--ink);background:#fff}
textarea.inp{min-height:88px;resize:vertical}
.row2{display:flex;gap:10px;margin-top:20px}
.row2 + .row2{margin-top:10px}
.row2 button{flex:1;padding:15px 0;border-radius:14px;font-weight:700;font-size:16px;transition:transform .15s}
.row2 button:active{transform:scale(.97)}
.btn-ghost{background:var(--surface)}
.btn-main{background:var(--ink);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface);font-weight:600;width:100%;text-align:left}
.sw{width:51px;height:31px;border-radius:999px;background:#D6D6D6;position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.toggle.on .sw{background:var(--red)}
.toggle.on .sw::after{transform:translateX(20px)}
.irow{display:flex;gap:8px;margin-bottom:8px;align-items:stretch;animation:rise .3s var(--ease)}
.irow .inp{flex:1;min-width:0}
.qty{display:flex;align-items:center;background:var(--surface);border-radius:12px;flex:none}
.qty button{width:38px;height:100%;min-height:50px;font-size:22px;font-weight:700;transition:transform .15s}
.qty button:active{transform:scale(.85)}
.qty span{min-width:24px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.idel{width:40px;border-radius:12px;background:var(--surface);color:var(--red);font-weight:800;flex:none}
.dchips{display:flex;gap:8px;flex-wrap:wrap}
.dchips button{padding:10px 14px;border-radius:999px;background:var(--surface);font-weight:700;font-size:14px;transition:all .2s}
.dchips button.on{background:var(--ink);color:#fff}
.dchips input{padding:8px 10px;border-radius:999px;border:0;background:var(--surface);font-weight:700}
.list-box{background:var(--surface);border-radius:14px;overflow:hidden}
.list-box > *{display:flex;align-items:center;gap:8px;width:100%;padding:15px 16px;border-bottom:1px solid #fff;font-size:16px;font-weight:600;text-align:left;color:var(--ink);text-decoration:none}
.list-box > *:last-child{border-bottom:0}
.list-box .chev{margin-left:auto;color:var(--ink3)}
.pin{text-align:center;font-size:30px;letter-spacing:16px;font-variant-numeric:tabular-nums;margin-top:14px}
.pin::placeholder{letter-spacing:6px;font-size:18px}
.mrow{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid #fff;flex-wrap:wrap}
.mrow:last-child{border-bottom:0}
.mname{flex:1;font-weight:700;min-width:100px}
.mmeta{font-size:12px;color:var(--ink2);font-weight:500;margin-top:1px}
.mbtn{padding:7px 10px;border-radius:9px;background:#fff;font-size:13px;font-weight:700}
.mbtn.red{color:var(--red)}
.kbadge{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:6px;padding:2px 6px;vertical-align:2px}
.shelf{display:flex;gap:8px;margin-bottom:8px}
.shelf .inp{padding:11px 12px;font-size:15px}
.shelf .inp.k{flex:2}.shelf .inp.l{flex:1}
.shelf button{width:44px;border-radius:12px;background:var(--surface);color:var(--red);font-weight:800;flex:none}
.log{background:var(--surface);border-radius:14px;padding:4px 14px;font-size:14px;color:var(--ink2)}
.log div{padding:9px 0;border-bottom:1px solid #fff}
.log div:last-child{border-bottom:0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{aspect-ratio:1;border-radius:12px;background:var(--surface) center/cover;animation:sh 1.2s infinite linear;background-image:linear-gradient(90deg,var(--surface),#fafafa,var(--surface));background-size:200% 100%}
.photos .ph.loaded{animation:none;background-size:cover}

/* ---------- pull to refresh ---------- */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 18px);z-index:0;width:28px;height:28px;margin-left:-14px;display:grid;place-items:center;opacity:0;pointer-events:none}
.ptr.anim{transition:opacity .35s ease}
#ptrSpace{height:0;transition:height .45s cubic-bezier(.3,.2,.3,1)}
#ptrSpace.on{height:58px}
.ptr-spin{width:22px;height:22px;border-radius:50%;border:2.5px solid #E2E2E2;border-top-color:#8E8E93}
#app{position:relative;z-index:1;background:var(--bg)}
.ptr.loading .ptr-spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));z-index:40;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.2);transform:translate(-50%,-160%);opacity:0;visibility:hidden;transition:transform .5s var(--ease),opacity .3s,visibility 0s .5s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .5s var(--ease),opacity .3s}
.toast.has-undo{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast .undo{color:#FFD60A;font-weight:800;font-size:15px}
.sync{font-size:12px;color:var(--ink3);text-align:center;margin-top:16px}

/* ---------- print labels ---------- */
#printArea{display:none}
.pv-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.label{width:100mm;height:150mm;background:#fff;color:#000;border:1px solid #ddd;padding:6mm;display:flex;flex-direction:column;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
.pv-wrap .label{transform:scale(.8);transform-origin:top center;margin-bottom:-30mm;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.label .lp{font-size:18pt;font-weight:900;padding:2mm 4mm;border-radius:2mm;color:#fff;align-self:flex-start;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.label .lno{font:900 24pt/1.1 ui-monospace,Menlo,monospace;margin-top:4mm;word-break:break-all}
.label .lship{font-size:12pt;font-weight:800;margin-top:2mm}
.label .lurg{display:inline-block;border:2px solid #000;padding:0 2mm;margin-left:2mm}
.label .lit{margin-top:4mm;border-top:2px solid #000;padding-top:3mm;font-size:13pt;font-weight:700;line-height:1.45}
.label .lit div{display:flex;gap:2mm;align-items:center}
.label .lit span{border:1.5px solid #000;border-radius:1mm;padding:0 1.5mm;font-size:10pt}
.label .lnote{margin-top:auto;border:2px dashed #000;padding:2mm 3mm;font-size:11pt}
@media print{
  @page{size:100mm 150mm;margin:0}
  html,body{background:#fff}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block !important}
  #printArea .label{border:0;page-break-after:always;break-after:page}
}

/* ---------- liquid glass（只用在固定的幾個元件，保持順暢） ---------- */
.top{background:rgba(255,255,255,.66);-webkit-backdrop-filter:saturate(200%) blur(22px);backdrop-filter:saturate(200%) blur(22px)}
.tabbar-in{background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.48));border:1px solid rgba(255,255,255,.75);box-shadow:0 12px 36px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.05),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(0,0,0,.04)}
.tb-pill{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.7));box-shadow:0 2px 10px rgba(0,0,0,.10),inset 0 1px 0 #fff,inset 0 -.5px 0 rgba(0,0,0,.06)}
.toast{background:rgba(28,28,30,.74);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid rgba(255,255,255,.14);border-radius:18px}
.mask.show{background:rgba(0,0,0,.22)}
.sheet{background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border-top:1px solid rgba(255,255,255,.8);box-shadow:0 -8px 30px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.chip{background:rgba(0,0,0,.045);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.go{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 14px rgba(0,0,0,.14)}
.go.light{box-shadow:inset 0 1px 0 #fff}
.printbar button{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 14px rgba(0,0,0,.14)}
</style>
</head>
<body>
<div class="ptr" id="ptr"><div class="ptr-spin"></div></div>
<div id="ptrSpace"></div>
<div class="wrap" id="app">
  <div class="top" id="top">
    <div class="top-row">
      <div>
        <div class="date" id="date"></div>
        <div class="title">鳳梨小姐出貨系統</div>
        <div class="hello" id="hello"></div>
      </div>
      <button class="avatar" id="avatar" aria-label="我的">🍍</button>
    </div>
    <div id="cutoff"></div>
    <div class="stats" id="stats"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="main"></div>
  <div class="sync" id="sync"></div>
</div>


<nav class="tabbar"><div class="tabbar-in" id="tabbar"></div></nav>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
<div id="printArea"></div>

<script>
var PLATFORMS = {
  web:    {name:'官網',  color:'var(--p-web)',    ink:'#3A2A00', hex:'#F5B400', bar:'var(--p-web)',
           link:function(no){return 'https://admin.shoplineapp.com/admin/mctstore/orders?query='+encodeURIComponent(no)}},
  myship: {name:'賣貨便', color:'var(--p-myship)', ink:'#fff', hex:'#00843D', bar:'linear-gradient(var(--p-711-o) 0 33%,var(--p-myship) 33% 67%,var(--p-711-r) 67%)',
           link:function(){return 'https://myship.7-11.com.tw/seller/order/DealWith'}}
};
var STEPS = ['待出貨','待出貨','待出貨','已寄出'];
var NEXT_LABEL = ['包好了','寄件單貼好了','拍封箱照並寄出'];
var ICON = {
  copy:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
  ext:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  cam:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  print:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 9V4h10v5M7 17H4v-7h16v7h-3M7 14h10v6H7z"/></svg>',
  arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  box:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg>',
  list:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  truck:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M2 6h12v10H2zM14 9h4l3 3v4h-7"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  shirt:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/></svg>',
  packed:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>',
  me:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke-linecap="round"/></svg>'
};
var LINKS = [
  ['官網後台（Shopline）','https://admin.shoplineapp.com/admin/mctstore/orders'],
  ['賣貨便賣家訂單','https://myship.7-11.com.tw/seller/order/DealWith']
];

var state = {orders:[], settings:{cutoff:'14:00'}, shelves:[], view:'ship', pf:'all', pickScope:'today',
             me:null, token:null, busy:false, loggedIn:false, loaded:false, seen:{}, pendingPhoto:null, catalog:{ver:0,items:[]}};
try{ var _c=JSON.parse(localStorage.getItem('pb_cat')||'null'); if(_c&&_c.items) state.catalog=_c; }catch(e){}

/* ---------- storage ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

/* ---------- server ---------- */
var API_URL = 'https://script.google.com/macros/s/AKfycbwyVBQUX3tGlofFc-iYp3rwPEl1ScULjJQPGGjwwrysoPDiBEt691u4jq2t3LlPOcLE/exec';
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args,token:state.token})})
    .then(function(r){return r.json()})
    .then(function(j){
      if(j.error==='AUTH'){ signedOut(); throw new Error('請重新登入'); }
      if(j.error) throw new Error(j.error);
      return j.data;
    });
}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return ('0'+n).slice(-2)}
function hm(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function mdOf(s){var p=s.split('-');return (+p[1])+'/'+(+p[2])}
function isToday(t){return ymd(new Date(t))===ymd()}
function when(t){return isToday(t)?hm(t):mdOf(ymd(new Date(t)))+' '+hm(t)}
function ago(t){var m=Math.round((Date.now()-t)/60000);if(m<1)return '剛剛';if(m<60)return m+' 分鐘前';var h=Math.round(m/60);if(h<24)return h+' 小時前';return Math.round(h/24)+' 天前'}
function isAdmin(){return state.me && state.me.role==='admin'}
function pinOk(p){return /^\d{4}$/.test(p)}
function toast(msg,undo){var el=$('toast');el.textContent=msg;if(undo){var b=document.createElement('button');b.className='undo';b.textContent='復原';b.onclick=function(){el.classList.remove('show');undo()};el.appendChild(b);}el.classList.toggle('has-undo',!!undo);el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show')},undo?5000:2300)}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(function(){fallbackCopy(t)});
  fallbackCopy(t); return Promise.resolve();
}
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a)}
function cutoffMin(){var p=(state.settings.cutoff||'14:00').split(':');return (+p[0])*60+(+p[1])}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function defaultShipBy(){return nowMin()<cutoffMin()?ymd():addDays(1)}
function dueOf(o){ return null; if(!o.shipBy||!/^\d{4}-\d\d-\d\d$/.test(o.shipBy)) return null; var t=ymd(); return o.shipBy<t?'over':(o.shipBy===t?'today':'later'); }
function parseItems(text){
  return String(text||'').split(/\n+/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){
    var m=/^(.*?)[\s　]*[xX×*＊][\s　]*(\d+)\s*$/.exec(l);
    return m ? {name:m[1].trim().replace(/\s+/g,' '), qty:+m[2]} : {name:l.replace(/\s+/g,' '), qty:1};
  });
}
function locOf(name){
  var best=null;
  state.shelves.forEach(function(s){ if(s.k && name.indexOf(s.k)>=0 && (!best || s.k.length>best.k.length)) best=s; });
  return best?best.loc:'';
}
var _catCache={};
function norm(s){return String(s||'').replace(/[^\p{L}\p{N}]/gu,'').toLowerCase()}
function dice(a,b){ if(a.length<2||b.length<2) return 0; var m={},i,c=0; for(i=0;i<a.length-1;i++){var g=a.substr(i,2);m[g]=(m[g]||0)+1} for(i=0;i<b.length-1;i++){var g2=b.substr(i,2); if(m[g2]>0){m[g2]--;c++}} return 2*c/(a.length+b.length-2); }
function catFor(name){
  if(!name) return null; if(_catCache.hasOwnProperty(name)) return _catCache[name];
  var n=norm(name), best=null, bs=0;
  state.catalog.items.forEach(function(c){
    var cn=c._n||(c._n=norm(c.n)); if(!cn) return;
    var s = n===cn?1000 : n.indexOf(cn)>=0?100+cn.length : (cn.indexOf(n)>=0&&n.length>=3)?60+n.length : dice(n,cn)*40;
    if(s>bs){bs=s;best=c}
  });
  return (_catCache[name] = bs>=20?best:null);
}
function thumb(name,cls){
  var c=catFor(name);
  return c ? '<img class="pimg '+(cls||'')+'" loading="lazy" alt="" src="'+esc(c.t)+'" data-full="'+esc(c.f)+'" data-title="'+esc(c.n)+'">'
           : '<span class="pimg ph '+(cls||'')+'">'+ICON.shirt+'</span>';
}
document.addEventListener('error',function(e){var t=e.target; if(t&&t.classList&&t.classList.contains('pimg')&&t.dataset.full&&t.src!==t.dataset.full){t.src=t.dataset.full}},true);
function syncCatalog(ver){
  if(!ver || ver===state.catalog.ver || syncCatalog._busy) return;
  syncCatalog._busy=true;
  call('apiCatalog').then(function(c){ state.catalog=c; _catCache={}; try{localStorage.setItem('pb_cat',JSON.stringify(c))}catch(e){} render(); })
    .catch(function(){}).then(function(){syncCatalog._busy=false});
}
function tween(el,to){
  var from=+el.getAttribute('data-v')||0; el.setAttribute('data-v',to);
  if(from===to){el.textContent=to;return}
  var t0=performance.now(), d=450;
  (function f(t){var p=Math.min(1,(t-t0)/d); p=1-Math.pow(1-p,3); el.textContent=Math.round(from+(to-from)*p); if(p<1) requestAnimationFrame(f)})(t0);
}

/* ---------- header ---------- */
function isTodo(o){return !o.status||o.status<1}
function isPacked(o){return o.status===1||o.status===2}
function isShipped(o){return o.status>=3}
var WEEK='日一二三四五六';
function renderHeader(){
  var d=new Date();
  $('date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WEEK[d.getDay()];
  $('hello').innerHTML = state.me ? '嗨，<b>'+esc(state.me.name)+'</b>'+(isAdmin()?'<span class="kbadge">總控</span>':'') : '請先登入';
  $('avatar').innerHTML = state.me ? esc(state.me.name.slice(0,1))+(isAdmin()?'<span class="k">總控</span>':'') : '🍍';
  var active=state.orders.filter(function(o){return o.status<3});
  var dueToday=active.filter(function(o){var u=dueOf(o);return u==='today'||u==='over'}).length;
  var left=cutoffMin()-nowMin();
  var cut=state.settings.cutoff||'14:00';
  $('cutoff').innerHTML = true ? '' : (left>0
    ? '<div class="cutoff">'+ICON.clock+'<span>'+cut+' 截單</span><span class="sub">還有 '+(left>=60?Math.floor(left/60)+' 小時 ':'')+(left%60)+' 分 · 今天要寄 '+dueToday+' 筆</span></div>'
    : '<div class="cutoff closed">'+ICON.clock+'<span>今天已截單</span><span class="sub">之後的訂單明天寄 · 今天還有 '+dueToday+' 筆沒寄</span></div>');
  var over=active.filter(function(o){return dueOf(o)==='over'}).length;
  var shippedToday=state.orders.filter(function(o){return o.status===3&&isToday(o.updatedAt)}).length;
  var todoN=state.orders.filter(isTodo).length, packedN=state.orders.filter(isPacked).length;
  if(!$('stats').children.length){
    $('stats').innerHTML=['待包貨','已包好','今天已出貨'].map(function(l,i){return '<div class="stat'+(i===2?' hl':'')+'"><b data-v="0">0</b><span>'+l+'</span></div>'}).join('');
  }
  var on = state.sf==='shipToday'?2 : state.view==='packed'?1 : state.view==='ship'?0 : -1;
  [].forEach.call($('stats').children,function(el,i){ el.dataset.stat=i; el.classList.toggle('on',i===on); });
  var bs=$('stats').querySelectorAll('b'); [todoN,packedN,shippedToday].forEach(function(v,i){tween(bs[i],v)});
  var pool = state.orders.filter(state.view==='done'?isShipped:state.view==='packed'?isPacked:isTodo);
  var chips=[['all','全部']].concat(Object.keys(PLATFORMS).map(function(k){return [k,PLATFORMS[k].name]}));
  $('chips').innerHTML = chips.map(function(p){
    var n = pool.filter(function(o){return p[0]==='all'||o.platform===p[0]}).length;
    var P=PLATFORMS[p[0]], on=state.pf===p[0];
    var st = on && P ? 'background:'+P.color+';color:'+P.ink : '';
    return '<button class="chip'+(on?' on':'')+'" style="'+st+'" data-pf="'+p[0]+'">'+(P&&!on?'<i style="background:'+P.color+'"></i>':'')+p[1]+' '+n+'</button>';
  }).join('');
}

/* ---------- tab bar ---------- */
function renderTabs(){
  var pickN = pickRows().reduce(function(a,r){return a+r.qty},0);
  var packedN = state.orders.filter(isPacked).length;
  var tabs=[['ship','包貨',ICON.box],['pick','揀貨',ICON.list],['packed','已包好',ICON.packed],['done','已出貨',ICON.truck],['me','我的',ICON.me]];
  var tb=$('tabbar');
  if(!tb.querySelector('.tb-pill')){
    tb.innerHTML='<span class="tb-pill"></span>'+tabs.map(function(t){ return '<button class="tb" data-view="'+t[0]+'">'+t[2]+'<span class="badge" hidden></span>'+t[1]+'</button>'; }).join('');
  }
  var idx=0;
  tabs.forEach(function(t,i){
    var b=tb.querySelector('[data-view="'+t[0]+'"]'); var on=state.view===t[0]; if(on) idx=i; b.classList.toggle('on',on);
    var n = t[0]==='pick'?pickN : t[0]==='packed'?packedN : 0; var bd=b.querySelector('.badge');
    bd.hidden=!(n&&state.loggedIn); bd.textContent=n; bd.classList.toggle('dark',t[0]==='packed');
  });
  tb.querySelector('.tb-pill').style.transform='translateX('+(idx*100)+'%)';
}

/* ---------- main ---------- */
function render(){
  renderHeader(); renderTabs();
  var m=$('main');
  if(!state.loggedIn){ m.innerHTML='<div class="empty view"><div class="big">🍍</div><b>請先登入</b>用自己的名字和密碼登入</div>'; return; }
  if(!state.loaded){ m.innerHTML='<div class="list"><div class="sk"></div><div class="sk"></div></div>'; return; }
  if(state.view==='pick') return renderPick();
  var done = state.view==='done', packedV = state.view==='packed';
  var rows = state.orders.filter(function(o){
    if(state.sf==='over'){ if(isShipped(o)||dueOf(o)!=='over') return false; }
    else if(state.sf==='shipToday'){ if(!(isShipped(o)&&isToday(o.updatedAt))) return false; }
    else if(!(done?isShipped(o):packedV?isPacked(o):isTodo(o))) return false;
    return state.pf==='all' || o.platform===state.pf;
  });
  if(!done){
    var rank={over:0,today:1,later:2};
    rows.sort(function(a,b){
      return (b.urgent-a.urgent) || ((rank[dueOf(a)]==null?3:rank[dueOf(a)])-(rank[dueOf(b)]==null?3:rank[dueOf(b)])) || (b.createdAt-a.createdAt);
    });
  } else rows.sort(function(a,b){return b.updatedAt-a.updatedAt});
  if(!rows.length){
    m.innerHTML='<div class="empty view"><div class="big">'+(done?'📭':packedV?'📦':'🎉')+'</div><b>'+(done?'最近 7 天沒有出貨的訂單':packedV?'沒有等著寄的包裹':'今天的貨都包好了')+'</b>'+(done?'':packedV?'包好的訂單會排在這裡，拿去超商寄':'官網、賣貨便的新訂單會自動出現在這裡')+'</div>';
    return;
  }
  var i=0;
  var bar=state.sf?'<div class="sfbar"><span>'+(state.sf==='over'?'只看逾期的訂單':'只看今天出貨的訂單')+'</span><button data-sfclear>顯示全部</button></div>':'';
  if(packedV){ bar='<div class="printbar">'+Object.keys(PLATFORMS).map(function(k){ var n=state.orders.filter(function(o){return isPacked(o)&&o.platform===k}).length;
      return n?'<button data-printpf="'+k+'"><i style="background:'+PLATFORMS[k].color+'"></i>'+ICON.print+'印'+PLATFORMS[k].name+' '+n+' 張</button>':''; }).join('')+'</div>'; }
  m.innerHTML=bar+'<div class="list view">'+rows.map(function(o){ var isNew=!state.seen[o.id]; state.seen[o.id]=1; return cardHTML(o,isNew?i++:-1); }).join('')+'</div>';
}

function dueTag(o){
  var u=dueOf(o); if(!u||o.status>=3) return '';
  if(u==='over') return '<span class="tag overdue">逾期 '+mdOf(o.shipBy)+'</span>';
  if(u==='today') return '<span class="tag orange">今天寄</span>';
  return '<span class="tag gray">'+(o.shipBy===addDays(1)?'明天寄':mdOf(o.shipBy)+' 寄')+'</span>';
}
function lastStep(o,word){ var h=o.history||[]; for(var i=h.length-1;i>=0;i--){ if(String(h[i].s||'')===word) return h[i]; } return null; }
function whoHTML(o){
  if(isTodo(o)) return '';
  var pk=lastStep(o,'已包好'), sh=isShipped(o)?lastStep(o,'已寄出'):null;
  if(!pk&&!sh) return '';
  return '<div class="who">'+(pk?'<span>'+ICON.packed+'<b>'+esc(pk.by)+'</b> 包貨 <i>'+when(pk.at)+'</i></span>':'')+
    (sh?'<span>'+ICON.truck+'<b>'+esc(sh.by)+'</b> 出貨 <i>'+when(sh.at)+'</i></span>':'')+'</div>';
}
function cardHTML(o,newIdx){
  var p = PLATFORMS[o.platform]||{name:o.platform==='shopee'?'蝦皮':o.platform,color:'#888',ink:'#fff',bar:'#888'};
  var last = o.history && o.history.length ? o.history[o.history.length-1] : null;
  var items = parseItems(o.items);
  var h = '<div class="card'+(newIdx>=0?' new':'')+(o.urgent&&o.status<3?' urgent':'')+'" style="--i:'+Math.max(newIdx,0)+'" data-id="'+esc(o.id)+'">'+
    '<div class="bar" style="background:'+p.bar+'"></div>'+
    '<div class="c-head"><span class="tag" style="background:'+p.color+';color:'+p.ink+'">'+p.name+'</span>'+
    (o.urgent&&o.status<3?'<span class="tag red">急單</span>':'')+dueTag(o)+
    '<span class="age">'+(o.status>=3&&last?when(last.at)+' 出貨':isPacked(o)&&last?when(last.at)+' 包好':ago(o.createdAt))+'</span></div>'+
    '<div class="ono-row"><span class="ono">'+esc(o.orderNo||'（未填編號）')+'</span>'+(o.orderNo?'<button class="icon-btn" data-act="copy" aria-label="複製編號">'+ICON.copy+'</button>':'')+'</div>'+
    (items.length?'<div class="items">'+items.map(function(it){var l=locOf(it.name);return '<div class="item">'+thumb(it.name)+'<div class="itx"><div class="iname">'+esc(it.name)+'</div><div class="imeta">'+(l?'<span class="loc">'+esc(l)+'</span>':'')+'<span class="iq">× '+it.qty+'</span></div></div></div>'}).join('')+'</div>':'')+
    (o.note?'<div class="note"><b>備註 </b>'+esc(o.note)+'</div>':'')+
    whoHTML(o)+
    '<div class="prog-l"><span>'+(last&&isTodo(o)?esc(last.s)+' · '+esc(last.by)+' '+when(last.at):'')+'</span>'+
    ((o.photos||[]).length?'<span></span>':'')+'</div>';
  if(isTodo(o)){
    h += '<button class="go" data-act="ship">'+ICON.check+'已包好</button>'+
      '<div class="sub"><button data-act="urgent" class="'+(o.urgent?'u-on':'')+'">'+(o.urgent?'取消急單':'急單')+'</button><button data-act="edit">詳細</button></div>';
  } else if(isPacked(o)){
    h += '<button class="go light" data-act="print">'+ICON.print+'列印標籤</button>'+
      '<div class="sub"><button data-act="unpack">改回待包貨</button><button data-act="shipped">已出貨</button><button data-act="edit">詳細</button></div>';
  } else {
    h += '<div class="sub"><button data-act="unship">改回已包好</button><button data-act="edit">詳細</button></div>';
  }
  return h+'</div>';
}

/* ---------- pick list ---------- */
function pickOrders(){
  return state.orders.filter(function(o){
    if(!isTodo(o)) return false;
    if(state.pf!=='all' && o.platform!==state.pf) return false;
    return true;
  });
}
function pickRows(){
  var map={}, out=[];
  pickOrders().forEach(function(o){
    parseItems(o.items).forEach(function(it){
      if(!map[it.name]){ map[it.name]={name:it.name,qty:0,refs:[],loc:locOf(it.name)}; out.push(map[it.name]); }
      map[it.name].qty+=it.qty;
      map[it.name].refs.push((PLATFORMS[o.platform]||{name:''}).name+' '+String(o.orderNo||'').slice(-4)+(it.qty>1?' ×'+it.qty:''));
    });
  });
  out.sort(function(a,b){ return (a.loc||'~').localeCompare(b.loc||'~','zh-Hant',{numeric:true}) || a.name.localeCompare(b.name,'zh-Hant'); });
  return out;
}
function pickKey(n){return 'pick_'+ymd()+'_'+n}
function renderPick(){
  var rows=pickRows(), os=pickOrders();
  var total=rows.reduce(function(a,r){return a+r.qty},0);
  var html='<div class="view">';
  if(!rows.length){
    $('main').innerHTML=html+'<div class="empty"><div class="big">🧺</div><b>沒有要揀的貨</b>還沒包的訂單會自動合併在這裡</div></div>'; return;
  }
  html+='<div class="pick-sum"><b>'+total+' 件</b><span>今天要包的貨 · 來自 '+os.length+' 筆訂單</span></div><div class="list" id="plist">'+
    rows.map(function(r,i){var d=lsGet(pickKey(r.name))==='1';
      return '<div class="prow card new'+(d?' done':'')+'" style="--i:'+i+'" data-pick="'+esc(r.name)+'"><span class="ck">'+ICON.check+'</span>'+
        thumb(r.name,'sm')+'<div class="pmain"><div class="pn">'+(r.loc?'<span class="loc">'+esc(r.loc)+'</span> ':'')+esc(r.name)+'</div><div class="pref">'+esc(r.refs.join('、'))+'</div></div>'+
        '<div class="pq"><small>×</small>'+r.qty+'</div></div>';}).join('')+'</div>'+

    (state.shelves.length?'':'<div class="hint" style="text-align:center;margin-top:12px;color:var(--ink2);font-size:13px">'+(isAdmin()?'到「我的 → 貨架位置」設定後，這裡會顯示每件衣服放在哪':'總控制人設定貨架位置後，這裡會顯示每件衣服放在哪')+'</div>')+'</div>';
  $('main').innerHTML=html;
}

/* ---------- data ---------- */
function apply(data){
  if(!data) return;
  state.orders = data.orders||[];
  if(data.me){ state.me=data.me; lsSet('pb_me',JSON.stringify(data.me)); }
  if(data.settings) state.settings=data.settings;
  if(data.shelves) state.shelves=data.shelves;
  if(data.catalogVer) setTimeout(function(){syncCatalog(data.catalogVer)},0);
  var sig=JSON.stringify([data.orders,data.settings,data.shelves,state.me&&state.me.name]);
  var same=state.loaded&&state.loggedIn&&sig===state._sig; state._sig=sig;
  state.loggedIn=true; state.loaded=true;
  $('sync').textContent='最後同步 '+hm(Date.now());
  if(same) renderHeader(); else render();
}
function load(){
  if(!state.token) return Promise.resolve();
  return call('apiList').then(apply).catch(function(e){ if(state.token) toast('讀取失敗，請稍後再試'); console.log(e)});
}
function act(fn){
  if(state.busy) return Promise.resolve();
  state.busy=true;
  var args=Array.prototype.slice.call(arguments,1);
  return call.apply(null,[fn].concat(args)).then(apply).catch(function(e){
    toast((e&&e.message)?e.message:'操作失敗，請再按一次'); console.log(e); render();
  }).then(function(){state.busy=false});
}
function findOrder(id){return state.orders.filter(function(o){return o.id===id})[0]}

function closeSheet(){ $('mask').classList.remove('show'); }
$('mask').addEventListener('click',function(e){ if(e.target===$('mask') && state.loggedIn) closeSheet(); });
document.addEventListener('click',function(e){ if(e.target.closest('[data-close]')) closeSheet(); });

/* ---------- login ---------- */
function signedOut(){
  state.token=null; state.me=null; state.loggedIn=false; state.loaded=false; state.orders=[];
  lsDel('pb_token'); lsDel('pb_me'); render(); showLogin();
}
function signedIn(res){
  state.token=res.token; state.me=res.me; state.loggedIn=true;
  lsSet('pb_token',res.token); lsSet('pb_me',JSON.stringify(res.me));
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  closeSheet(); toast('嗨，'+res.me.name); render(); load();
}
function urlName(){ try{ return new URLSearchParams(location.search).get('u'); }catch(e){ return null; } }
function showLogin(){
  openSheet('<h2>登入</h2><div class="hint">載入中…</div>');
  call('apiStatus').then(function(s){
    if(!s.hasAdmin) return showBootstrap();
    var u=urlName();
    if(u && s.names.indexOf(u)>=0) return askPin(u);
    if(!s.names.length){ openSheet('<h2>登入</h2><div class="hint">還沒有任何帳號，請總控制人先新增。</div>'); return; }
    openSheet('<h2>你是誰？</h2><div class="hint">選自己的名字，再輸入你的 4 位數密碼。'+(s.names.length<2?'<br>小幫手的名字要先由總控制人在「我的 → 人員管理」新增，才會出現在這裡。':'')+'</div>'+
      '<div class="lbl">名字</div><div class="list-box" id="pp">'+s.names.map(function(n){return '<button data-name="'+esc(n)+'">'+esc(n)+'<span class="chev">›</span></button>'}).join('')+'</div>');
    $('pp').addEventListener('click',function(e){var b=e.target.closest('[data-name]');if(b)askPin(b.getAttribute('data-name'))});
  }).catch(function(){ openSheet('<h2>登入</h2><div class="hint">連不上伺服器，請確認網路後重新整理。</div>'); });
}
function askPin(name){
  openSheet('<h2>嗨，'+esc(name)+'</h2><div class="hint">輸入你的 4 位數密碼</div>'+
    '<input class="inp pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">'+
    '<div class="row2"><button class="btn-ghost" id="back">不是我</button><button class="btn-main" id="go">登入</button></div>');
  var go=function(){
    var p=$('pin').value.trim(); if(!pinOk(p)){toast('密碼是 4 位數字');return}
    $('go').disabled=true; $('go').textContent='登入中…';
    call('apiLogin',name,p).then(signedIn).catch(function(e){ toast(e.message); $('go').disabled=false; $('go').textContent='登入'; $('pin').value=''; $('pin').focus(); });
  };
  $('go').onclick=go;
  $('back').onclick=function(){ try{history.replaceState(null,'',location.pathname)}catch(e){} showLogin(); };
  $('pin').addEventListener('input',function(){ if(this.value.length===4) go(); });
  setTimeout(function(){$('pin').focus()},350);
}
function showBootstrap(){
  openSheet('<h2>建立總控制人</h2><div class="hint">第一次使用：先建立總控制人帳號。總控制人可以新增人員、設定截單時間和貨架位置。</div>'+
    '<div class="lbl">名字</div><input class="inp" id="bName" maxlength="12" placeholder="例如：老闆">'+
    '<div class="lbl">4 位數密碼</div><input class="inp pin" id="bPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••">'+
    '<div class="lbl">再輸入一次</div><input class="inp pin" id="bPin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••">'+
    '<div class="row2"><button class="btn-main" id="bGo">建立並登入</button></div>');
  $('bGo').onclick=function(){
    var n=$('bName').value.trim(), p=$('bPin').value.trim();
    if(!n){toast('請輸入名字');return}
    if(!pinOk(p)){toast('密碼要是 4 位數字');return}

function compress(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1280, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.72));
    };
    img.onerror=rej; img.src=url;
  });
}

    if(job.ship){ shipOut(job.id); } else { toast('照片已存好'); if(job.reopen){ var o=findOrder(job.id); if(o) orderForm(o); } }

function setLocal(id,status){ var o=findOrder(id); if(!o) return null; var prev=o.status; o.status=status; o.updatedAt=Date.now(); o.history=(o.history||[]).concat([{s:status>=3?'已寄出':status>=1?'已包好':'改回待包貨',by:state.me?state.me.name:'',at:Date.now()}]); return prev; }
function quick(id,status,msg,undoable){

    .catch(function(e){ state.syncing--; setLocal(id,prev); render(); toast('沒有成功，請再按一次'); });
  toast(msg, undoable?function(){ quick(id,prev,'已復原',false); }:null);
}

(function(){
  var tb=$('tabbar'), sx=null, moved=false, idx=-1, skip=false;
  function geo(){ var r=tb.getBoundingClientRect(); return {r:r,w:(r.width-10)/5}; }
  tb.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; moved=false; idx=-1; },{passive:true});
  tb.addEventListener('touchmove',function(e){ if(sx===null) return; var x=e.touches[0].clientX;
    if(!moved && Math.abs(x-sx)<8) return; moved=true; e.preventDefault();
    var g=geo(), pill=tb.querySelector('.tb-pill'), px=Math.max(0,Math.min(4*g.w,x-g.r.left-5-g.w/2));
    pill.style.transition='transform .08s linear'; pill.style.transform='translateX('+px+'px) scale(1.06)';
    var i=Math.max(0,Math.min(4,Math.floor((x-g.r.left-5)/g.w)));

  function end(){ if(sx===null) return; sx=null; var pill=tb.querySelector('.tb-pill'); pill.style.transition='';
    tb.querySelectorAll('.tb').forEach(function(b){ b.classList.remove('hover'); });
    if(!moved||idx<0){ return; } skip=true; setTimeout(function(){skip=false},450);
    var b=tb.querySelectorAll('.tb')[idx], v=b&&b.dataset.view;

  var ptr=$('ptr'), spin=ptr.firstChild, space=$('ptrSpace'), busy=false, TRIG=70, raf=0;
  function paint(){ raf=0; var y=-window.scrollY; if(busy) return;
    if(y>0){ ptr.style.opacity=Math.min(1,Math.max(0,(y-10)/45)); spin.style.transform='rotate('+(y*4)+'deg)'; }
    else if(ptr.style.opacity!=='0'){ ptr.style.opacity=0; } }
  window.addEventListener('scroll',function(){ if(!raf) raf=requestAnimationFrame(paint); },{passive:true});
  window.addEventListener('touchend',function(){
    if(busy || !state.loggedIn || $('mask').classList.contains('show')) return;
    if(-window.scrollY>=TRIG){ busy=true; ptr.classList.add('loading'); ptr.style.opacity=1; spin.style.transform=''; space.classList.add('on');
      if(navigator.vibrate) navigator.vibrate(8);
      var t0=Date.now(); var done=function(){ setTimeout(function(){ space.classList.remove('on'); ptr.classList.add('anim'); ptr.style.opacity=0;
        setTimeout(function(){ ptr.classList.remove('loading','anim'); busy=false; },450); }, Math.max(0,700-(Date.now()-t0))); };
      load().then(done,done);
    }
  },{passive:true});
})();

/* ---------- start ---------- */
state.token=lsGet('pb_token');
try{ state.me=JSON.parse(lsGet('pb_me')||'null'); }catch(e){}
if(state.token){ state.loggedIn=true; }
render();
if(state.token){ load(); } else { showLogin(); }
setInterval(function(){ if(state.loggedIn && !document.hidden && !state.busy && !state.syncing && !$('mask').classList.contains('show')) load(); else renderHeader(); }, 15000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden && state.loggedIn) load(); });
</script>
